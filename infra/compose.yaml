name: job-hunter

services:
  db:
    image: postgres:16-alpine
    container_name: job-hunter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - job_hunter_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    # Banco de dados NÃO exposto publicamente no host (acessível apenas na rede interna)
    networks:
      - job_hunter_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-jobhunter_user} -d $${POSTGRES_DB:-jobhunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: base
    container_name: job-hunter-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: ${APP_NAME:-Job Hunter}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      PLANNED_HOSTNAME: ${PLANNED_HOSTNAME:-https://jobhunter.ctrls.dev.br}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobhunter_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-jh_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-jh_csrf}
      SESSION_EXPIRE_HOURS: ${SESSION_EXPIRE_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      LOGIN_ACCOUNT_IP_MAX_ATTEMPTS: ${LOGIN_ACCOUNT_IP_MAX_ATTEMPTS:-5}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-20}
      LOGIN_COOLDOWN_SECONDS: ${LOGIN_COOLDOWN_SECONDS:-300}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HIMALAYAS_API_KEY: ${HIMALAYAS_API_KEY:-}
      AI_ASSISTED_ENABLED: ${AI_ASSISTED_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-none}
      AI_RATE_LIMIT_WINDOW_SECONDS: ${AI_RATE_LIMIT_WINDOW_SECONDS:-900}
      AI_USER_WINDOW_MAX_REQUESTS: ${AI_USER_WINDOW_MAX_REQUESTS:-10}
      AI_USER_DAILY_MAX_REQUESTS: ${AI_USER_DAILY_MAX_REQUESTS:-30}
      AI_USER_DAILY_MAX_TOKENS: ${AI_USER_DAILY_MAX_TOKENS:-60000}
      AI_GLOBAL_DAILY_MAX_TOKENS: ${AI_GLOBAL_DAILY_MAX_TOKENS:-100000}
      AI_RESERVATION_TTL_SECONDS: ${AI_RESERVATION_TTL_SECONDS:-60}
      AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
      AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-120}
      AI_HTTP_TOTAL_TIMEOUT_SECONDS: ${AI_HTTP_TOTAL_TIMEOUT_SECONDS:-24.0}
      AI_HTTP_CONNECT_TIMEOUT_SECONDS: ${AI_HTTP_CONNECT_TIMEOUT_SECONDS:-5.0}
      AI_HTTP_READ_TIMEOUT_SECONDS: ${AI_HTTP_READ_TIMEOUT_SECONDS:-20.0}
      AI_HTTP_MAX_RESPONSE_BYTES: ${AI_HTTP_MAX_RESPONSE_BYTES:-262144}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180,https://jobhunter.ctrls.dev.br}
    volumes:
      - ../local-seeds:/run/local-seeds:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8090}:8000"
    networks:
      - job_hunter_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend-test:
    profiles: ["test"]
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: testing
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobhunter_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}_test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobhunter_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobhunter}_test
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
    volumes:
      - ../local-seeds:/run/local-seeds:ro
    networks:
      - job_hunter_net
    command: ["pytest"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: job-hunter-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5180}:80"
    networks:
      - job_hunter_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  job_hunter_pgdata:
    name: job_hunter_pgdata

networks:
  job_hunter_net:
    name: job_hunter_net
    driver: bridge
