[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-backend"
version = "0.2.0"
description = "Job Hunter - Backend API (Fase 02: Motor de descoberta de oportunidades v1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic[email]>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "argon2-cffi>=23.1.0,<25.0.0",
    "httpx>=0.27.0,<1.0.0",
    "reportlab>=4.2.5,<5.0.0",
    "python-docx>=1.1.2,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pypdf>=5.1.0,<6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.materials.export" = ["fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
